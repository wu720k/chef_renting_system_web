<article class="card h-100 chef-card" [class.selected]="selected()">
  <img
    class="card-img-top chef-image"
    [src]="chef().image || placeholder"
    [alt]="chef().name"
    (error)="onImageError($event)"
  />
  <div class="card-body">
    <h3 class="card-title h6">{{ chef().name }}</h3>
    <p class="card-text small mb-2"><strong>Konyha Típus: {{ chef().cuisine }}</strong></p>
    <p class="card-text small text-body-secondary">{{ chef().description }}</p>
    <p class="card-text small mb-2">Alap Díj: {{ chef().baseFee }} €</p>
    <p class="card-text small mb-0">Napi díj: {{ chef().dailyRate }} €/nap</p>
  </div>
  <div class="card-footer">
    <button type="button" class="btn btn-brand btn-sm" (click)="book.emit(chef())">
      {{ selected() ? 'Kiválasztva' : 'Lefoglalom' }}
    </button>
  </div>
</article>
