<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container-fluid px-3">
    <a class="navbar-brand app-brand" routerLink="/" (click)="closeMenu()">{{ brand }}</a>

    <button
      class="navbar-toggler"
      type="button"
      aria-controls="mainNavigation"
      aria-label="Menü megnyitása"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavigation" [class.show]="menuOpen()">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @for (link of links; track link.label) {
          <li class="nav-item">
            <a class="nav-link app-nav-link" [routerLink]="link.path" routerLinkActive="active" (click)="closeMenu()">{{ link.label }}</a>
          </li>
        }
      </ul>

      <form class="d-flex" role="search" (submit)="onSearchSubmit($event)">
        <input
          class="form-control me-2 app-search-input"
          type="search"
          name="search"
          placeholder="Keresés"
          aria-label="Keresés"
          autocomplete="off"
          [value]="searchService.term()"
          (input)="onSearchInput($any($event.target).value)"
        />
        <button class="btn btn-outline-brand" type="submit">Keresés</button>
      </form>
    </div>
  </div>
</nav>
